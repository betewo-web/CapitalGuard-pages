<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1528"/>
      <stop offset="100%" style="stop-color:#111a32"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3ce6d1"/>
      <stop offset="100%" style="stop-color:#56a8ff"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="168" stroke="url(#ring)" stroke-width="20" fill="none" opacity="0.9"/>
  <!-- Middle ring -->
  <circle cx="256" cy="256" r="100" stroke="url(#ring)" stroke-width="16" fill="none" opacity="0.7"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="28" fill="url(#ring)"/>
  <!-- Small decorative ticks at 45° intervals on outer ring -->
  <line x1="256" y1="72" x2="256" y2="90" stroke="#3ce6d1" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <line x1="440" y1="256" x2="422" y2="256" stroke="#56a8ff" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <line x1="256" y1="440" x2="256" y2="422" stroke="#3ce6d1" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <line x1="72" y1="256" x2="90" y2="256" stroke="#56a8ff" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
</svg>
