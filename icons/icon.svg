<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e1528"/>
      <stop offset="100%" style="stop-color:#111a32"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- D05: outer ring / inner ring / four ticks outside the ring / centre cross.
       Flat colour, no opacity. Geometry = D05 (512 grid) scaled 0.84 so the ticks
       stay ~42px clear of the tile edge. -->
  <circle cx="256" cy="256" r="139" stroke="#3ce6d1" stroke-width="25" fill="none"/>
  <circle cx="256" cy="256" r="84" stroke="#3ce6d1" stroke-width="22" fill="none"/>
  <g stroke="#3ce6d1" stroke-width="13" stroke-linecap="round">
    <line x1="256" y1="70" x2="256" y2="49"/>
    <line x1="442" y1="256" x2="463" y2="256"/>
    <line x1="256" y1="442" x2="256" y2="463"/>
    <line x1="70" y1="256" x2="49" y2="256"/>
  </g>
  <g stroke="#3ce6d1" stroke-width="20" stroke-linecap="round">
    <line x1="227" y1="256" x2="285" y2="256"/>
    <line x1="256" y1="227" x2="256" y2="285"/>
  </g>
</svg>
