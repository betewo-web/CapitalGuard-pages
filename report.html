<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股每日分析報告</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f0f2f5; font-family:'Noto Sans TC',sans-serif; font-size:.9rem; }
  .top-bar { background:linear-gradient(135deg,#1a237e,#283593); color:#fff; padding:.8rem 1.2rem;
             display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.5rem; }
  .top-bar .brand { font-size:1.1rem; font-weight:700; letter-spacing:.03em; }
  .top-bar .nav-right { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; }
  .date-btn { background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3);
              color:#fff; border-radius:6px; padding:3px 10px; font-size:.8rem; cursor:pointer; }
  .date-btn:hover { background:rgba(255,255,255,.25); }
  .date-btn.active { background:#fff; color:#1a237e; font-weight:700; }
  .date-btn:disabled { opacity:.4; cursor:default; }
  .btn-wl { background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35);
             color:#fff; border-radius:6px; padding:4px 14px; font-size:.82rem; text-decoration:none; }
  .btn-wl:hover { background:rgba(255,255,255,.28); color:#fff; }
  .btn-logout { background:transparent; border:1px solid rgba(255,255,255,.35);
                color:rgba(255,255,255,.75); border-radius:6px; padding:4px 10px;
                font-size:.78rem; cursor:pointer; }
  .btn-logout:hover { color:#fff; }
  .content-wrap { max-width:1100px; margin:1.5rem auto; padding:0 1rem 2rem; }
  .strat-card { background:#fff; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.07); margin-bottom:2rem; overflow:hidden; }
  .strat-hd { padding:1rem 1.4rem; font-size:1rem; font-weight:700; }
  .bg-gold   { background:linear-gradient(90deg,#f57f17,#ff8f00); color:#fff; }
  .bg-rocket { background:linear-gradient(90deg,#1565c0,#1976d2); color:#fff; }
  .strat-hd .sub { font-size:.78rem; font-weight:400; opacity:.85; margin-left:.4rem; }
  .table-responsive { max-height:70vh; overflow-y:auto; }
  table { font-size:.82rem; margin:0; }
  thead th { position:sticky; top:0; background:#f8f9fa; white-space:nowrap;
             border-bottom:2px solid #dee2e6 !important; font-size:.78rem; z-index:1; }
  td, th { vertical-align:middle; padding:.45rem .6rem !important; }
  .rank-num { font-weight:700; color:#555; min-width:24px; display:inline-block; text-align:right; }
  .score-badge { display:inline-block; min-width:42px; padding:2px 8px; border-radius:20px;
                 text-align:center; font-weight:700; color:#fff; font-size:.8rem; }
  .s-high{background:#2e7d32;} .s-mid{background:#f57f17;} .s-low{background:#c62828;}
  .sig-tag { display:inline-block; background:#e3f2fd; color:#1565c0; border-radius:4px;
             padding:1px 5px; font-size:.72rem; margin:1px; white-space:nowrap; }
  .na { color:#bbb; }
  /* login gate */
  #login-gate { display:flex; align-items:center; justify-content:center; min-height:80vh; }
  .login-box { background:#fff; border-radius:14px; box-shadow:0 4px 20px rgba(0,0,0,.1);
               padding:2.5rem 2rem; text-align:center; max-width:320px; width:100%; }
  .login-box h5 { font-weight:700; margin-bottom:.5rem; }
  .login-box p { color:#666; font-size:.88rem; margin-bottom:1.5rem; }
  #main-section { display:none; }
  @media(max-width:576px){
    .top-bar { padding:.6rem .9rem; }
    .top-bar .brand { font-size:.95rem; }
    td, th { padding:.35rem .4rem !important; font-size:.76rem; }
  }
</style>
</head>
<body>

<!-- ── Login Gate ──────────────────────────────────────────────── -->
<div id="login-gate">
  <div class="login-box">
    <div style="font-size:2.5rem;margin-bottom:.8rem">📊</div>
    <h5>台股每日分析報告</h5>
    <p>請先登入以查看今日分析報告</p>
    <a href="watchlist.html" class="btn btn-primary w-100">前往登入</a>
    <div class="mt-2" style="font-size:.75rem;color:#aaa">登入後返回此頁即可查看</div>
  </div>
</div>

<!-- ── Main Section ───────────────────────────────────────────── -->
<div id="main-section">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand">📊 台股每日分析報告</div>
    <div class="nav-right">
      <div id="date-tabs" class="d-flex gap-1"></div>
      <a href="watchlist.html" class="btn-wl">自選股</a>
      <button class="btn-logout" onclick="logout()">登出</button>
    </div>
  </div>

  <!-- Report Content -->
  <div class="content-wrap">
    <div id="report-info" class="text-muted small mb-3"></div>
    <div id="report-body"></div>
  </div>
</div>

<script>
// ── 全域狀態（需在 auth 之前宣告，避免 TDZ 錯誤）──────────────────────
let availableDates = [];  // sorted desc
let currentIdx = 0;       // 0 = latest

// ── Auth ─────────────────────────────────────────────────────────
// 優先順序：
//   1. URL ?token=xxx（LINE 通知個人化連結）→ 存 localStorage
//   2. localStorage['rpt_token']（上次由 LINE 連結開啟後留下）
//   3. localStorage['sma_session']（watchlist.html 已登入的用戶）

const _qs = new URLSearchParams(location.search);
const _urlToken = _qs.get("token");
if (_urlToken) {
  localStorage.setItem("rpt_token", _urlToken);
  history.replaceState(null, "", location.pathname);
}

let _authToken = _urlToken
  || localStorage.getItem("rpt_token")
  || (() => { try { const s = JSON.parse(localStorage.getItem("sma_session")||"null"); return s && s.accessToken; } catch{} return null; })();

function logout() {
  localStorage.removeItem("rpt_token");
  location.href = "watchlist.html";
}

if (!_authToken) {
  document.getElementById("login-gate").style.display = "flex";
} else {
  document.getElementById("login-gate").style.display = "none";
  document.getElementById("main-section").style.display = "block";
  initReport();
}

// ── Date Navigation ─────────────────────────────────────────────

async function initReport() {
  // 用本地時間（避免 toISOString UTC 日期與台灣日期差一天）
  function localDateStr(offsetDays = 0) {
    const d = new Date();
    d.setDate(d.getDate() - offsetDays);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  // 先直接載入 latest（最可靠，不受 HEAD 請求限制）
  availableDates = ["latest"];
  renderDateTabs();
  loadReport(0);  // 不等待，先顯示 latest

  // 背景探測最近 3 天的日期版 JSON（用於日期導覽）
  const dated = [];
  for (let i = 0; i < 3; i++) {
    const dt = localDateStr(i);
    try {
      const r = await fetch(`report_data_${dt}.json?t=${Date.now()}`, { method: "HEAD", cache: "no-store" });
      if (r.ok) dated.push(dt);
    } catch {}
  }
  if (dated.length) {
    availableDates = dated;  // 有日期版就用日期版
    renderDateTabs();
    // 如果 latest 已顯示，保持不重新載入（已顯示的就是最新的）
  }
}

function renderDateTabs() {
  const wrap = document.getElementById("date-tabs");
  wrap.innerHTML = "";
  availableDates.forEach((dt, i) => {
    const label = dt === "latest" ? "最新" : (i === 0 ? `${dt} (今日)` : dt);
    const btn = document.createElement("button");
    btn.className = "date-btn" + (i === 0 ? " active" : "");
    btn.textContent = label;
    btn.onclick = () => { currentIdx = i; loadReport(i); renderDateTabs(); };
    wrap.appendChild(btn);
  });
}

async function loadReport(idx) {
  const dt = availableDates[idx];
  const url = dt === "latest" ? "report_data_latest.json" : `report_data_${dt}.json`;
  document.getElementById("report-body").innerHTML =
    '<div class="text-center py-5 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>載入中…</div>';
  try {
    const r = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    renderReport(data);
  } catch(e) {
    document.getElementById("report-body").innerHTML =
      `<div class="alert alert-warning">無法載入報告：${e.message}</div>`;
  }
}

// ── Render ──────────────────────────────────────────────────────
function renderReport(data) {
  const date = data.date || "—";
  const strategies = data.strategies || [];
  document.getElementById("report-info").textContent =
    `分析日期：${date}　共分析 ${Object.keys(data.universe || {}).length} 支股票`;

  const body = document.getElementById("report-body");
  body.innerHTML = "";

  if (!strategies.length) {
    body.innerHTML = '<div class="alert alert-info">此報告無策略資料（可能為舊版 JSON）。</div>';
    return;
  }

  strategies.forEach(strat => {
    const isRocket = strat.id === "early_uptrend";
    const card = document.createElement("div");
    card.className = "strat-card";
    card.innerHTML = `
      <div class="strat-hd ${isRocket ? "bg-rocket" : "bg-gold"}">
        ${strat.emoji} ${strat.name} <span class="sub">前 ${strat.rows.length} 名</span>
        <span class="sub float-end opacity-75">${strat.description}</span>
      </div>
      <div class="table-responsive">
        ${buildTable(strat.rows)}
      </div>`;
    body.appendChild(card);
  });
}

function buildTable(rows) {
  if (!rows || !rows.length) return '<p class="text-muted p-3">（無資料）</p>';
  const thead = `<thead><tr>
    <th>#</th><th>代號</th><th>名稱</th><th>產業</th>
    <th title="綜合分數">分數</th><th>PE</th><th>ROE%</th><th>RSI</th>
    <th title="量能比">量</th><th>技術訊號</th>
  </tr></thead>`;
  const trows = rows.map(r => {
    const score = r.composite_score;
    const sc = (score == null || isNaN(score)) ? "" :
               (score >= 65 ? "s-high" : score >= 45 ? "s-mid" : "s-low");
    const scoreBadge = score != null
      ? `<span class="score-badge ${sc}">${(+score).toFixed(1)}</span>` : '<span class="na">—</span>';
    const fmtNum = (v, dec=1) => (v == null || isNaN(v)) ? '<span class="na">—</span>' : (+v).toFixed(dec);
    const sigs = (r.signals || []).slice(0, 3)
      .map(s => `<span class="sig-tag">${s}</span>`).join("");
    return `<tr>
      <td><span class="rank-num">${r.rank ?? ""}</span></td>
      <td><strong>${r.stock_id || ""}</strong></td>
      <td>${r.stock_name || ""}</td>
      <td><small class="text-muted">${r.industry_category || ""}</small></td>
      <td>${scoreBadge}</td>
      <td>${fmtNum(r.pe)}</td>
      <td>${fmtNum(r.roe)}</td>
      <td>${fmtNum(r.rsi, 0)}</td>
      <td>${fmtNum(r.vol_ratio)}</td>
      <td>${sigs}</td>
    </tr>`;
  }).join("");
  return `<table class="table table-hover table-sm">${thead}<tbody>${trows}</tbody></table>`;
}
</script>
</body>
</html>
