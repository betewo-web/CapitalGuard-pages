<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 與 sw.js 的 CACHE_VERSION 同號（test_sw_cache_version 會擋）；每個請求帶 X-App-Version（S31） -->
  <meta name="app-version" content="159">
  <title>管理儀表板 — 台股監控</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <meta name="theme-color" content="#0f0f1a">
  <style>
    /* ── 色票：與 watchlist.css 同一組介面色；資料序列用經驗證的六色（ADMIN_DASHBOARD.md） ── */
    :root {
      color-scheme: dark;
      --bg-0: #0b0b13; --bg-1: #0f0f1a; --bg-2: #14141f;
      --surface: #171724; --surface-2: #1c1c2b;
      --border: rgba(146, 146, 163, 0.2);
      --text-0: #f5f5f7; --text-1: #c9c9d4; --text-muted: #9292a3;
      --accent: #8b7cff; --accent-2: #f5c542;
      --grid: #2a2a3a; --axis: #3a3a4c;
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
      --series-4: #c98500; --series-5: #d55181; --series-6: #9085e9;
      --good: #0ca30c; --warn: #fab219; --bad: #d03b3b;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0; color: var(--text-0);
      font-family: "Noto Sans TC", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px; line-height: 1.5;
      background:
        radial-gradient(1200px 480px at 8% -12%, rgba(86,168,255,.10) 0%, rgba(86,168,255,0) 60%),
        radial-gradient(900px 420px at 95% -5%, rgba(139,124,255,.08) 0%, rgba(139,124,255,0) 62%),
        linear-gradient(145deg, var(--bg-0), var(--bg-1) 46%, var(--bg-2));
      background-attachment: fixed;
    }
    a { color: var(--accent); }
    button { font: inherit; }

    /* ── 頂欄 ── */
    .topbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap;
      padding: .6rem 1rem; background: rgba(10,16,32,.78); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(121,157,255,.2);
    }
    .brand { display: inline-flex; align-items: center; gap: .55rem; font-weight: 700; letter-spacing: .02em; }
    .brand svg { width: 26px; height: 26px; }
    .brand .sub { font-weight: 500; color: var(--text-muted); font-size: .85rem; }
    .top-actions { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .chip { display: inline-flex; align-items: center; gap: .35rem; padding: .25rem .65rem; border-radius: 999px;
            border: 1px solid var(--border); background: rgba(255,255,255,.04); color: var(--text-1); font-size: .8rem; }
    .btn { display: inline-flex; align-items: center; gap: .35rem; padding: .35rem .8rem; border-radius: 10px; cursor: pointer;
           border: 1px solid var(--border); background: rgba(255,255,255,.04); color: var(--text-0); font-size: .85rem; text-decoration: none; }
    .btn:hover { background: rgba(255,255,255,.08); }
    .btn.primary { border-color: rgba(139,124,255,.6); background: rgba(139,124,255,.18); }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn.is-busy svg { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 篩選列（一列，位於所有圖表之上） ── */
    .filters { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; padding: .9rem 1rem 0; max-width: 1280px; margin: 0 auto; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .seg button { padding: .35rem .8rem; border: 0; background: transparent; color: var(--text-1); cursor: pointer; }
    .seg button + button { border-left: 1px solid var(--border); }
    .seg button.active { background: rgba(139,124,255,.22); color: var(--text-0); font-weight: 700; }
    .filters .meta { color: var(--text-muted); font-size: .8rem; margin-left: auto; }

    /* ── 版面 ── */
    .wrap { max-width: 1280px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    .wrap.loading .card, .wrap.loading .tile { opacity: .55; transition: opacity .2s; }
    h2.sec { font-size: 1rem; font-weight: 700; margin: 1.6rem 0 .6rem; color: var(--text-0); display: flex; align-items: baseline; gap: .6rem; }
    h2.sec small { font-weight: 400; color: var(--text-muted); font-size: .8rem; }
    .grid { display: grid; gap: .8rem; grid-template-columns: repeat(12, minmax(0, 1fr)); }
    .span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-6 { grid-column: span 6; }
    .span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }
    @media (max-width: 992px) { .span-3 { grid-column: span 6; } .span-4, .span-8 { grid-column: span 12; } }
    @media (max-width: 640px) { .span-3, .span-6 { grid-column: span 12; } }

    /* ── 統計磚 ── */
    .tiles { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: .7rem .9rem; min-height: 78px; }
    .tile .lbl { color: var(--text-muted); font-size: .76rem; }
    .tile .val { font-size: 1.55rem; font-weight: 600; line-height: 1.2; margin-top: .15rem; }
    .tile.hero .val { font-size: 2.6rem; }
    .tile .delta { font-size: .76rem; color: var(--text-1); margin-top: .1rem; }
    .tile .delta.up { color: var(--good); }
    .tile .delta.warn { color: var(--warn); }
    .tile .delta.bad { color: var(--bad); }

    /* ── 卡片（圖 ↔ 表格） ── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .8rem .9rem .6rem; display: flex; flex-direction: column; min-width: 0; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: .3rem; }
    .card-title { font-weight: 700; font-size: .92rem; }
    .card-title small { display: block; font-weight: 400; color: var(--text-muted); font-size: .74rem; }
    .card-tools { display: flex; align-items: center; gap: .4rem; }
    .legend { display: flex; gap: .7rem; flex-wrap: wrap; font-size: .74rem; color: var(--text-1); margin: 0 0 .3rem; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: .3rem; vertical-align: -1px; }
    .legend i.line { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }
    .chart { width: 100%; height: 240px; }
    .chart.tall { height: 320px; }
    .chart.short { height: 190px; }
    .tbl-wrap { overflow: auto; max-height: 360px; }
    table.tbl { width: 100%; border-collapse: collapse; font-size: .8rem; }
    table.tbl th, table.tbl td { padding: .3rem .45rem; border-bottom: 1px solid var(--grid); text-align: left; white-space: nowrap; }
    table.tbl th { color: var(--text-muted); font-weight: 500; position: sticky; top: 0; background: var(--surface); }
    table.tbl td.num, table.tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .card[data-mode="table"] .chart { display: none; }
    .card[data-mode="chart"] .tbl-wrap { display: none; }
    .empty { color: var(--text-muted); font-size: .82rem; padding: 1.4rem .4rem; text-align: center; }
    .badge { display: inline-block; padding: .05rem .45rem; border-radius: 999px; font-size: .7rem; border: 1px solid var(--border); color: var(--text-1); }
    .badge.pro { border-color: rgba(245,197,66,.5); color: var(--accent-2); }
    .badge.basic { border-color: rgba(139,124,255,.5); color: #c4b5fd; }
    .badge.admin { border-color: rgba(12,163,12,.5); color: #6fdc6f; }
    /* 示範帳號是官網截圖用的，不計入任何經營數字（migrate_demo_account.sql） */
    .badge.demo { border-color: rgba(154,165,189,.5); color: var(--text-2); }

    /* ── 第零層：待辦 ── */
    .todo-wrap { display: grid; gap: .5rem; margin-bottom: .4rem; }
    .todo { display: flex; gap: .7rem; align-items: flex-start; background: var(--surface);
            border: 1px solid var(--border); border-left: 3px solid var(--sev); border-radius: 12px; padding: .6rem .8rem; }
    .todo[data-level="high"]   { --sev: var(--bad); }
    .todo[data-level="medium"] { --sev: var(--warn); }
    .todo[data-level="low"]    { --sev: var(--text-muted); }
    .todo .ic { font-size: 1.05rem; line-height: 1.4; }
    .todo .bd { min-width: 0; }
    .todo .t { font-weight: 700; font-size: .92rem; }
    .todo .d { color: var(--text-1); font-size: .8rem; margin-top: .1rem; }
    .todo .who { margin-top: .3rem; display: flex; gap: .3rem; flex-wrap: wrap; }
    .todo .who span { font-size: .74rem; border: 1px solid var(--border); border-radius: 999px; padding: .05rem .5rem; color: var(--text-1); }
    .todo-ok { color: var(--good); font-size: .85rem; background: var(--surface); border: 1px solid var(--border);
               border-left: 3px solid var(--good); border-radius: 12px; padding: .6rem .8rem; }

    /* ── 第一層：漏斗 ── */
    .fn { display: grid; gap: .35rem; margin-top: .2rem; }
    .fn-row { display: grid; grid-template-columns: 7.5rem 1fr 5.5rem; gap: .6rem; align-items: center; font-size: .82rem; }
    .fn-name { color: var(--text-1); }
    .fn-track { position: relative; height: 22px; background: rgba(255,255,255,.05); border-radius: 4px; overflow: hidden; }
    .fn-fill { position: absolute; inset: 0 auto 0 0; background: var(--series-1); border-radius: 4px 0 0 4px; }
    .fn-num { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-0); }
    .fn-num i { font-style: normal; color: var(--text-muted); font-size: .74rem; margin-left: .35rem; }
    .fn-drop { color: var(--bad); font-size: .74rem; }

    /* ── 閘門（未登入／非管理者／未部署） ── */
    .gate { max-width: 460px; margin: 12vh auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.6rem 1.4rem; text-align: center; }
    .gate h1 { font-size: 1.1rem; margin: .4rem 0 .6rem; }
    .gate p { color: var(--text-1); font-size: .9rem; }
    .gate code { background: rgba(255,255,255,.06); padding: .1rem .35rem; border-radius: 6px; font-size: .82rem; }
  </style>
</head>

<script>
// ═══════════════════════════════════════════════════════════════
// 設定與共用（與 watchlist.html 同一個 Supabase 專案；只用 anon key + x-access-token）
// ═══════════════════════════════════════════════════════════════
const SUPABASE_URL  = "https://rnqdglmrkotutzmirivp.supabase.co";
const SUPABASE_ANON = "sb_publishable_o4MJLqOmlmYmUBhloYbF1g_SzAgqSSs";
const RANGE_KEY     = "cg-admin-days";
const AUTO_REFRESH_MS = 5 * 60 * 1000;

function appVersion() {
  const meta = document.querySelector('meta[name="app-version"]');
  const v = meta && (meta.getAttribute("content") || "").trim();
  return /^\d+$/.test(v || "") ? v : "0";
}

// 登入狀態沿用 App 的 localStorage（同一個 origin）；這頁不做登入
function sessionToken() {
  try { const s = JSON.parse(localStorage.getItem("sma_session") || "null"); return s && s.accessToken || null; } catch { return null; }
}
function sessionName() {
  try { const s = JSON.parse(localStorage.getItem("sma_session") || "null"); return s && s.displayName || ""; } catch { return ""; }
}

async function sbRpc(fn, params, accessToken) {
  const headers = {
    "apikey":        SUPABASE_ANON,
    "Authorization": `Bearer ${SUPABASE_ANON}`,
    "Content-Type":  "application/json",
    "X-App-Version": appVersion(),
  };
  if (accessToken) headers["x-access-token"] = accessToken;
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method: "POST", headers, body: JSON.stringify(params || {}) });
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = null; }
  if (!r.ok) {
    const err = new Error((data && (data.message || data.hint)) || `RPC ${fn}: ${r.status}`);
    err.status = r.status; err.code = data && data.code; err.data = data;
    throw err;
  }
  return data;
}

function escapeHtml(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtInt(n) { return Number(n || 0).toLocaleString("zh-TW"); }
function fmtPct(a, b) { return b ? `${Math.round((a / b) * 100)}%` : "—"; }
function fmtMoney(n) { return `NT$${fmtInt(n)}`; }
function fmtBytes(b) {
  b = Number(b || 0);
  if (b >= 1 << 30) return (b / (1 << 30)).toFixed(2) + " GB";
  if (b >= 1 << 20) return (b / (1 << 20)).toFixed(1) + " MB";
  if (b >= 1 << 10) return Math.round(b / (1 << 10)) + " KB";
  return b + " B";
}
function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleString("zh-TW", { timeZone: "Asia/Taipei", hour12: false, month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}
function fmtDay(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleDateString("zh-TW", { timeZone: "Asia/Taipei", month: "2-digit", day: "2-digit" });
}
function ago(iso) {
  if (!iso) return "從未";
  const ms = Date.now() - new Date(iso).getTime();
  const m = Math.round(ms / 60000);
  if (m < 1) return "剛剛";
  if (m < 60) return `${m} 分鐘前`;
  const h = Math.round(m / 60);
  if (h < 48) return `${h} 小時前`;
  return `${Math.round(h / 24)} 天前`;
}
function mdLabel(d) { return d.slice(5).replace("-", "/"); }

// 期間內每一天都要有一格：資料庫只回有紀錄的日期，沒補 0 的話折線會把空日子連起來
function fillDays(from, today, rows, key, valueKeys) {
  const map = {};
  (rows || []).forEach(r => { map[r[key]] = r; });
  const out = [];
  const d = new Date(from + "T00:00:00Z"), end = new Date(today + "T00:00:00Z");
  for (; d <= end; d.setUTCDate(d.getUTCDate() + 1)) {
    const k = d.toISOString().slice(0, 10);
    const row = { d: k };
    valueKeys.forEach(v => { row[v] = Number((map[k] || {})[v] || 0); });
    out.push(row);
  }
  return out;
}

// ═══════════════════════════════════════════════════════════════
// 標籤目錄——與 App 的埋點、後端條件登錄表由 test_admin_dashboard.py 雙向比對
// ═══════════════════════════════════════════════════════════════
const ACTION_LABELS = {
  app_open:          "開啟 App",
  login:             "登入",
  logout:            "登出",
  tab_view:          "切換分頁",
  refresh_manual:    "手動重新整理",
  watch_add:         "新增自選股",
  watch_remove:      "移除自選股",
  kline_open:        "看 K 線",
  radar_timeline_open: "看盤中時間軸",
  radar_history_open:  "展開歷史訊號",

// ═══════════════════════════════════════════════════════════════
// 圖表基底：細長的標記、髮絲線格線、統一 tooltip；序列色固定順序、不循環
// ═══════════════════════════════════════════════════════════════
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SERIES = () => [1, 2, 3, 4, 5, 6].map(i => css(`--series-${i}`));
const charts = {};   // id → echarts instance

function baseOption() {
  return {
    animationDuration: 300,
    textStyle: { fontFamily: '"Noto Sans TC", system-ui, sans-serif', color: css("--text-1") },
    grid: { left: 8, right: 16, top: 20, bottom: 4, containLabel: true },
    tooltip: {
      trigger: "axis", confine: true,
      axisPointer: { type: "line", lineStyle: { color: css("--axis"), width: 1 } },
      backgroundColor: css("--surface-2"), borderColor: css("--grid"),
      textStyle: { color: css("--text-0"), fontSize: 12 },
    },
  };
}
function axisCat(data, opts = {}) {
  return { type: "category", data, axisLine: { show: false }, axisTick: { show: false },
           axisLabel: { color: css("--text-muted"), fontSize: 11, ...(opts.axisLabel || {}) }, ...opts };
}
function axisVal(opts = {}) {
  return { type: "value", axisLine: { show: false }, axisTick: { show: false }, minInterval: 1,
           splitLine: { lineStyle: { color: css("--grid"), width: 1 } },
           axisLabel: { color: css("--text-muted"), fontSize: 11, formatter: v => Number(v).toLocaleString("zh-TW") }, ...opts };
}
function barSeries(name, data, color, extra = {}) {
  return { name, type: "bar", data, barMaxWidth: 24,
           itemStyle: { color, borderRadius: [4, 4, 0, 0] },
           emphasis: { itemStyle: { color, opacity: .85 } }, ...extra };
}
function hbarSeries(name, data, color, extra = {}) {
  return { name, type: "bar", data, barMaxWidth: 18,
           itemStyle: { color, borderRadius: [0, 4, 4, 0] },
           label: { show: true, position: "right", color: css("--text-1"), fontSize: 11, formatter: p => fmtInt(p.value) },
           emphasis: { itemStyle: { color, opacity: .85 } }, ...extra };
}
function lineSeries(name, data, color, extra = {}) {
  return { name, type: "line", data, smooth: false, lineStyle: { width: 2, color }, itemStyle: { color, borderColor: css("--surface"), borderWidth: 2 },
           symbol: "circle", symbolSize: 8, showSymbol: data.length <= 45, ...extra };
}

function mountChart(id, option, cls) {
  const host = document.querySelector(`#${id} .chart`);
  if (!host) return;
  if (cls) host.className = `chart ${cls}`;
  let inst = charts[id];
  if (!inst) { inst = echarts.init(host, null, { renderer: "canvas" }); charts[id] = inst; }
  inst.setOption(option, true);
}
window.addEventListener("resize", () => Object.values(charts).forEach(c => c.resize()));

// 每張卡片：標題、（多序列時的）圖例、圖、以及同一份數字的表格檢視
function card(id, title, sub, { head, rows, legend, empty, tall, short } = {}) {
  const el = document.getElementById(id);
  if (!el) return;
  const mode = el.dataset.mode || "chart";
  const hasData = rows && rows.length;
  el.dataset.mode = mode;
  el.innerHTML = `
    <div class="card-head">
      <div class="card-title">${escapeHtml(title)}${sub ? `<small>${escapeHtml(sub)}</small>` : ""}</div>
      <div class="card-tools">${hasData ? `<button type="button" class="btn" style="padding:.2rem .55rem;font-size:.75rem" onclick="toggleCard('${id}')">${mode === "chart" ? "表格" : "圖表"}</button>` : ""}</div>
    </div>
    ${legend && legend.length ? `<div class="legend">${legend.map(l => `<span><i class="${l.line ? "line" : ""}" style="background:${l.color}"></i>${escapeHtml(l.name)}</span>`).join("")}</div>` : ""}
    ${hasData ? `<div class="chart${tall ? " tall" : short ? " short" : ""}"></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map((h, i) => `<th class="${i ? "num" : ""}">${escapeHtml(h)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${i ? "num" : ""}">${escapeHtml(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`
    : `<div class="empty">${escapeHtml(empty || "期間內沒有資料")}</div>`};
  `;
  if (charts[id]) { charts[id].dispose(); delete charts[id]; }
  return hasData;
}
function toggleCard(id) {
  const el = document.getElementById(id);
  el.dataset.mode = el.dataset.mode === "chart" ? "table" : "chart";
  const btn = el.querySelector(".card-tools .btn");
  if (btn) btn.textContent = el.dataset.mode === "chart" ? "表格" : "圖表";
  if (el.dataset.mode === "chart" && charts[id]) charts[id].resize();
}
// 純表格卡（名單、系統狀態）
function tableCard(id, title, sub, head, rowsHtml, empty) {
  const el = document.getElementById(id);
  if (!el) return;
  el.dataset.mode = "table";
  el.innerHTML = `
    <div class="card-head"><div class="card-title">${escapeHtml(title)}${sub ? `<small>${escapeHtml(sub)}</small>` : ""}</div></div>
    ${rowsHtml.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map((h, i) => `<th class="${i ? "num" : ""}">${escapeHtml(h)}</th>`).join("")}</tr></thead><tbody>${rowsHtml.join("")}</tbody></table></div>`
                      : `<div class="empty">${escapeHtml(empty || "沒有資料")}</div>`}`;
}
function tile(lbl, val, delta, cls) {
  return `<div class="tile${cls ? " " + cls : ""}"><div class="lbl">${escapeHtml(lbl)}</div><div class="val">${escapeHtml(val)}</div>${delta ? `<div class="delta ${delta.cls || ""}">${escapeHtml(delta.text)}</div>` : ""}</div>`;
}

// ═══════════════════════════════════════════════════════════════
// 第零層與第一層：待辦、北極星、漏斗、點名冊
// ═══════════════════════════════════════════════════════════════

// 待辦：每一列指向一個人或一件事。沒有事就明講沒有事，不留空白讓人懷疑壞了。
function renderTodo(items) {
  const el = document.getElementById("todo");
  if (!items || !items.length) {
    el.innerHTML = `<div class="todo-ok">✓ 目前沒有需要處理的事</div>`;
    return;
  }
  el.innerHTML = items.map(t => `
    <div class="todo" data-level="${escapeHtml(t.level)}">
      <span class="ic" aria-hidden="true">${escapeHtml(TODO_ICON[t.kind] || "•")}</span>
      <div class="bd">
        <div class="t">${escapeHtml(t.title)}</div>
        <div class="d">${escapeHtml(t.detail)}</div>
        ${(t.names || []).length
          ? `<div class="who">${t.names.map(n => `<span>${escapeHtml(n)}</span>`).join("")}</div>` : ""}
      </div>
    </div>`).join("");
}

// 北極星：一個視圖只有一個主數字（dataviz 的 hero figure）
function renderNorthStar(ns) {
  const el = document.getElementById("c-northstar");
  if (!el || !ns) return;
  const v = Number(ns.value || 0), p = Number(ns.prev || 0), base = Number(ns.base || 0);
  const d = v - p;
  const arrow = d > 0 ? "▲" : d < 0 ? "▼" : "—";
  const cls = d > 0 ? "up" : d < 0 ? "bad" : "";
  el.dataset.mode = "table";
  el.innerHTML = `
    <div class="card-head"><div class="card-title">${escapeHtml(ns.label)}
      <small>${escapeHtml(ns.hint)}</small></div></div>
    <div style="padding:.2rem 0">
      <div style="font-size:3rem;font-weight:600;line-height:1.1">${escapeHtml(fmtInt(v))}</div>
      <div class="delta ${cls}" style="font-size:.8rem">${arrow} 較前一週 ${d >= 0 ? "+" : ""}${escapeHtml(String(d))}
        　·　共 ${escapeHtml(fmtInt(base))} 位真實使用者</div>
    </div>
    <div style="color:var(--text-muted);font-size:.78rem;margin-top:.6rem;line-height:1.5">
      這個數字同時涵蓋偵測、送達、打開三件事。任何一環失效它都會掉，所以它比註冊數誠實。</div>`;
}

// 漏斗：一色實心＝留存、底色＝流失。七階色階在深色面上擠不出足夠的明度差，
// 而且顏色本來就不該重複編碼長度已經表達的東西。
function renderFunnel(f) {
  const el = document.getElementById("c-funnel");
  if (!el || !f) return;
  const stages = f.stages || [];
  const top = Number((stages[0] || {}).n || 0) || 1;
  const rows = stages.map((st, i) => {
    const n = Number(st.n || 0);
    const prev = i ? Number(stages[i - 1].n || 0) : null;
    return { k: st.k, n, conv: prev ? Math.round(n * 100 / prev) : null,
             lost: prev === null ? 0 : prev - n, pct: n * 100 / top };
  });
  el.dataset.mode = "table";
  el.innerHTML = `
    <div class="card-head"><div class="card-title">啟用漏斗
      <small>逐關累進：每一關都要通過前面所有關，所以一定遞減</small></div></div>
    <div class="fn">${rows.map(r => `
      <div class="fn-row" title="${escapeHtml(FUNNEL_HINT[r.k] || "")}">
        <span class="fn-name">${escapeHtml(FUNNEL_LABELS[r.k] || r.k)}</span>
        <span class="fn-track"><i class="fn-fill" style="width:${r.pct.toFixed(1)}%"></i></span>
        <span class="fn-num">${escapeHtml(fmtInt(r.n))}${r.conv !== null ? `<i>${r.conv}%</i>` : ""}</span>
      </div>${r.lost > 0 ? `
      <div class="fn-row"><span></span><span class="fn-drop">↳ 這一關流失 ${r.lost} 人</span><span></span></div>` : ""}
    `).join("")}</div>`;
}

// 點名冊：n=7 的時候，長條圖會放大雜訊、藏住個體，一份名單才看得出誰卡在哪
function renderRoster(f) {
  const keys = ["open", "push", "watch", "got", "read", "active"];
  const rows = ((f && f.roster) || []).map(r => `<tr>
    <td>${escapeHtml(r.name)}</td>
    ${keys.map(k => `<td class="num">${r[k] ? "✓" : "—"}</td>`).join("")}
    <td class="num">${escapeHtml(r.stuck ? FUNNEL_LABELS[r.stuck] || r.stuck : "全部完成")}</td>
    <td class="num">${escapeHtml(fmtDay(r.created_at))}</td></tr>`);
  tableCard("c-roster", "使用者點名冊", "不含管理者。七個人的時候，點名冊比長條圖誠實",
    ["使用者", "開過 App", "推播", "自選", "收到", "打開", "近 7 日", "卡在", "註冊"],
    rows, "目前沒有非管理者使用者");
}

let stats = null;

function renderAll(s) {
  stats = s;
  const S = SERIES();
  const from = s.from, today = s.today, days = s.days;
  const u = s.users, a = s.activity, p = s.plans, w = s.watchlist, r = s.rules, al = s.alerts, ev = s.events, sys = s.system;
  const ns = s.north_star || { base: 0 };

  document.getElementById("meta").textContent =
    `${from} ～ ${today}（${days} 天）· 產生於 ${fmtDate(s.generated_at)}`;

  // 第零層與第一層。這兩段不受期間篩選影響——待辦講的是現在，漏斗講的是累積至今。
  renderTodo(s.todo);
  renderNorthStar(s.north_star);
  renderFunnel(s.funnel);
  renderRoster(s.funnel);

  // ── KPI ──
  const paid = (p.subscriptions.by_provider || []).filter(x => x.provider !== "manual").reduce((t, x) => t + Number(x.n), 0);
  const manual = (p.subscriptions.by_provider || []).filter(x => x.provider === "manual").reduce((t, x) => t + Number(x.n), 0);
  document.getElementById("kpis").innerHTML = [
    tile("註冊人數", fmtInt(u.total), { text: `期間新增 ${fmtInt(u.new_range)} · 今日 ${fmtInt(u.new_today)}`, cls: u.new_range ? "up" : "" }, "hero"),
    tile("今日活躍（DAU）", fmtInt(a.dau_today_real), { text: "不含管理者" }),
    tile("週活躍（WAU）", fmtInt(a.wau_real), { text: `不含管理者 · 共 ${fmtInt(ns.base)} 位` }),
    tile("月活躍（MAU）", fmtInt(a.mau_real), { text: a.mau_real ? `黏著度 DAU/MAU ${fmtPct(a.dau_today_real, a.mau_real)}` : "不含管理者" }),
    tile("付費訂閱", fmtInt(paid), { text: `手動指派 ${fmtInt(manual)} · 7 日內到期 ${fmtInt(p.subscriptions.expiring_7d)}`, cls: p.subscriptions.expiring_7d ? "warn" : "" }),
    tile("月經常收入 MRR", fmtMoney(p.mrr_twd), { text: `手動指派等值 ${fmtMoney(p.mrr_manual_twd)}` }),
    tile("自選股（筆）", fmtInt(w.total), { text: `${fmtInt(w.distinct_stocks)} 檔 · 每人 ${w.avg_per_user ?? 0}` }),
    tile("進階訊號", fmtInt(r.total), { text: `其中真實使用者 ${fmtInt(r.total_real)} 條 · ${fmtInt(r.users_real)} 人` }),
    tile("推播裝置", fmtInt(al.push_subscriptions.total), { text: `${fmtInt(al.push_subscriptions.users)} 人已開通知（${fmtPct(al.push_subscriptions.users, u.total)}）`, cls: al.push_subscriptions.users < u.total ? "warn" : "up" }),
  ].join("");

  // ── 使用者 ──
  const signups = fillDays(from, today, u.signups_by_day, "d", ["n"]);
  if (card("c-signups", "新註冊", `期間 ${fmtInt(u.new_range)} 人`, { head: ["日期", "新註冊"], rows: signups.map(x => [x.d, x.n]) })) {
    mountChart("c-signups", { ...baseOption(), xAxis: axisCat(signups.map(x => mdLabel(x.d))), yAxis: axisVal(),
      series: [barSeries("新註冊", signups.map(x => x.n), S[0])] });
  }
  const seen = [["1 天內", u.seen_1d], ["7 天內", u.seen_7d - u.seen_1d], ["30 天內", u.seen_30d - u.seen_7d], ["更久以前", u.seen_older], ["從未回報", u.never_seen]];
  if (card("c-lastseen", "最近一次活動", "依 last_seen_at 分組（App 回報後才有值）", { head: ["區間", "人數"], rows: seen })) {
    mountChart("c-lastseen", { ...baseOption(), grid: { left: 8, right: 40, top: 8, bottom: 4, containLabel: true },
      xAxis: axisVal({ splitLine: { show: false }, axisLabel: { show: false } }), yAxis: axisCat(seen.map(x => x[0]), { inverse: true }),
      series: [hbarSeries("人數", seen.map(x => x[1]), S[0])] });
  }
  tableCard("c-users", "使用者名單", `${fmtInt(u.list.length)} 人，依最近活動排序`,
    ["使用者", "方案", "自選股", "規則", "推播裝置", "期間操作數", "最近活動", "註冊"],
    u.list.map(x => `<tr><td>${escapeHtml(x.name)}${x.is_admin ? ' <span class="badge admin">管理者</span>' : ""}${x.is_demo ? ' <span class="badge demo">示範</span>' : ""}</td>
      <td class="num"><span class="badge ${escapeHtml(x.plan)}">${escapeHtml(x.plan)}</span></td>
      <td class="num">${fmtInt(x.watch)}</td><td class="num">${fmtInt(x.rules)}</td><td class="num">${fmtInt(x.push)}</td>
      <td class="num">${fmtInt(x.events_range)}</td><td class="num" title="${escapeHtml(fmtDate(x.last_seen_at))}">${escapeHtml(ago(x.last_seen_at))}</td>
      <td class="num">${escapeHtml(fmtDay(x.created_at))}</td></tr>`));

    ["最後一位註冊", `${fmtDate(sys.last_signup_at)}（${ago(sys.last_signup_at)}）`],
    ["事件資料最新日期", sys.last_event_date || "—"],
    ["未使用的登入碼", fmtInt(sys.pending_codes)],
    ["資料產生時間", fmtDate(s.generated_at)],
  ];
  tableCard("c-system", "系統狀態", "管線是否還活著，看這裡", ["項目", "值"],
    sysRows.map(x => `<tr><td>${escapeHtml(x[0])}</td><td class="num">${escapeHtml(x[1])}</td></tr>`));
}

// ═══════════════════════════════════════════════════════════════
// 載入、閘門、期間切換、自動更新
// ═══════════════════════════════════════════════════════════════
let currentDays = Number(localStorage.getItem(RANGE_KEY)) || 30;
let _lastLoadAt = 0, _loading = false;

function showGate(html) {
  const g = document.getElementById("gate");
  g.innerHTML = html; g.style.display = "";
  document.getElementById("filters").style.display = "none";
  document.getElementById("dash").style.display = "none";
}
function showDash() {
  document.getElementById("gate").style.display = "none";
  document.getElementById("filters").style.display = "";
  document.getElementById("dash").style.display = "";
}

async function loadStats(force) {
  if (_loading) return;
  const token = sessionToken();
  if (!token) {
    showGate(`<div style="font-size:2rem">🔐</div><h1>請先登入 App</h1><p>儀表板沿用 App 的登入狀態。請先在 <a href="watchlist.html">台股監控</a> 登入，再回到這一頁。</p>`);
    return;
  }
  if (!force && Date.now() - _lastLoadAt < 30000) return;
  _loading = true;
  const btn = document.getElementById("btn-refresh");
  btn.classList.add("is-busy"); btn.disabled = true;
  document.getElementById("dash").classList.add("loading");
  try {
    const data = await sbRpc("admin_stats", { p_days: currentDays }, token);
    if (!data) throw new Error("空回應");
    const who = document.getElementById("who");
    who.textContent = sessionName() || "管理者"; who.style.display = "";
    showDash();
    renderAll(data);
    _lastLoadAt = Date.now();
  } catch (e) {
    if (e.code === "update_required" || e.status === 426) {
      showGate(`<div style="font-size:2rem">⬆️</div><h1>App 需要更新</h1><p>${escapeHtml(e.message)}</p><button class="btn primary" onclick="location.reload()">重新載入</button>`);
    } else if (e.status === 403 || e.status === 401 || /admin only|permission/i.test(e.message || "")) {
      showGate(`<div style="font-size:2rem">🚫</div><h1>此頁僅供管理者使用</h1><p>目前登入：<b>${escapeHtml(sessionName() || "未知")}</b></p><a class="btn" href="watchlist.html">回 App</a>`);
    } else if (e.status === 404) {
      showGate(`<div style="font-size:2rem">🛠️</div><h1>儀表板尚未啟用</h1><p>資料庫尚未完成設定。</p><a class="btn" href="watchlist.html">回 App</a>`);
    } else {
      showGate(`<div style="font-size:2rem">⚠️</div><h1>載入失敗</h1><p>${escapeHtml(e.message || e)}</p><button class="btn primary" onclick="loadStats(true)">再試一次</button>`);
    }
  } finally {
    _loading = false;
    btn.classList.remove("is-busy"); btn.disabled = false;
    document.getElementById("dash").classList.remove("loading");
  }
}

function setDays(d) {
  currentDays = d;
  localStorage.setItem(RANGE_KEY, String(d));
  document.querySelectorAll("#range-seg button").forEach(b => b.classList.toggle("active", Number(b.dataset.days) === d));
  loadStats(true);
}
document.querySelectorAll("#range-seg button").forEach(b => b.addEventListener("click", () => setDays(Number(b.dataset.days))));
document.querySelectorAll("#range-seg button").forEach(b => b.classList.toggle("active", Number(b.dataset.days) === currentDays));

setInterval(() => { if (!document.hidden) loadStats(false); }, AUTO_REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - _lastLoadAt > 60000) loadStats(false); });

loadStats(true);
</script>
</body>
</html>
