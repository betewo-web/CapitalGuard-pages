<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="app-version" content="386">
  <title>CapitalGuard-股市雷達 — LINE 帳號綁定</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #0f1117; color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif; padding: 1rem;
    }
    .box {
      text-align: center; padding: 2.5rem 2rem;
      max-width: 320px; width: 100%;
      background: #1a1d27; border: 1px solid #2a2d3d; border-radius: 12px;
    }
    .icon { font-size: 3.5rem; margin-bottom: 1rem; }
    .title { font-size: 1.1rem; font-weight: 600; margin-bottom: .5rem; }
    .msg { color: #aaa; font-size: .85rem; line-height: 1.5; white-space: pre-line; }
    .err { color: #f87171; }
    .spinner {
      width: 40px; height: 40px; border: 4px solid #2a2d3d;
      border-top-color: #4c6ef5; border-radius: 50%;
      animation: spin .8s linear infinite; margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="box">
  <div id="spinner" class="spinner"></div>
  <div class="icon" id="icon" style="display:none"></div>
  <div class="title" id="title">正在驗證 LINE 身份…</div>
  <div class="msg"   id="msg"></div>
  <div id="friend-actions" style="display:none;margin-top:1.2rem;">
    <button onclick="openAddFriendPage()" style="padding:.6rem 1rem;background:#06c755;color:#fff;border:none;border-radius:8px;font-size:.9rem;cursor:pointer;">➕ 前往加好友</button>
    <button onclick="recheckFriendship()" style="margin-left:.5rem;padding:.6rem 1rem;background:#2a2d3d;color:#fff;border:1px solid #3a3f55;border-radius:8px;font-size:.9rem;cursor:pointer;">我已加入，重新驗證</button>
  </div>
  <!-- 分享模式（?share=）：選好友傳卡片／退路只傳網址／回 App（見 shareMain） -->
  <div id="share-actions" style="display:none;margin-top:1.2rem;">
    <button onclick="sharePick()" style="padding:.6rem 1rem;background:#06c755;color:#fff;border:none;border-radius:8px;font-size:.9rem;cursor:pointer;">選好友傳送</button>
    <button onclick="shareBack()" style="margin-left:.5rem;padding:.6rem 1rem;background:#2a2d3d;color:#fff;border:1px solid #3a3f55;border-radius:8px;font-size:.9rem;cursor:pointer;">回到 App</button>
  </div>
  <div id="share-fallback" style="display:none;margin-top:1.2rem;">
    <button onclick="shareSendUrl()" style="padding:.6rem 1rem;background:#06c755;color:#fff;border:none;border-radius:8px;font-size:.9rem;cursor:pointer;">把網址傳到 LINE</button>
    <button onclick="shareBack()" style="margin-left:.5rem;padding:.6rem 1rem;background:#2a2d3d;color:#fff;border:1px solid #3a3f55;border-radius:8px;font-size:.9rem;cursor:pointer;">回到 App</button>
  </div>
</div>

<script>
// ── 設定（由 setup_supabase.py 自動填入，或手動替換） ──────────────────────
const SUPABASE_URL  = "https://rnqdglmrkotutzmirivp.supabase.co";
const SUPABASE_ANON = "sb_publishable_o4MJLqOmlmYmUBhloYbF1g_SzAgqSSs";
const LIFF_ID       = "2010668840-DXPfjNlx";
const OA_BASIC_ID   = "@408csebn";

function hideFriendActions() {
  const panel = document.getElementById("friend-actions");
  if (panel) panel.style.display = "none";
}

function setStatus(icon, title, msg, isErr) {
  hideFriendActions();
  document.getElementById("spinner").style.display = "none";
  const iconEl = document.getElementById("icon");
  iconEl.textContent  = icon;
  iconEl.style.display = "";
  document.getElementById("title").textContent = title;
  const m = document.getElementById("msg");
  m.textContent = msg;
  m.classList.toggle("err", !!isErr);
}

async function main() {
  // 取得 URL 中的 session token（QR 綁定模式才有）
  const params       = new URLSearchParams(location.search);
  const liffState    = params.get("liff.state");
  const sessionToken = params.get("token") ||
                       (liffState ? new URLSearchParams(liffState).get("token") : null);
  const isBindMode   = !!sessionToken;  // 有 token = QR 綁定；無 token = 直接登入跳轉
  // 分享模式（FRIENDS.md「LINE 卡片分享」）：App 用 liff.line.me/<LIFF_ID>?share=<token> 把 LINE
  // 叫起來，這一頁在 LINE 裡自動登入後直接開「選好友」面板送 Flex 卡片。不走下面的綁定／登入。
  // 參數跟 token 一樣可能包在 liff.state 裡（LIFF 先轉一手再還原網址）。
  const shareToken   = params.get("share") ||
                       (liffState ? new URLSearchParams(liffState).get("share") : null);

  // 初始化 LIFF
  try {
    await liff.init({ liffId: LIFF_ID });
  } catch (e) {
    setStatus("❌", "LIFF 初始化失敗", `LIFF ID 可能未設定或不正確：${e.message}`, true);
    return;
  }

  // 若未登入，導向 LINE 授權；botPrompt:"aggressive" 會在授權後自動彈出「加入官方帳號好友」確認畫面
  if (!liff.isLoggedIn()) {
    // 分享模式不催加好友：分享者本來就是使用者，這裡只是借 LINE 的面板
    liff.login(shareToken ? { redirectUri: location.href } : { redirectUri: location.href, botPrompt: "aggressive" });
    return;
  }
  if (shareToken) { await shareMain(shareToken); return; }

  // 取得 LINE 個人資料
  let profile;
  try {
    profile = await liff.getProfile();
  } catch (e) {
    setStatus("❌", "無法取得 LINE 資料", e.message, true);
    return;
  }

  // 確認是否已加入官方帳號好友
  // 若未加入：自動重新導向並彈出加好友畫面（需 LINE Developers Console 已將 LOGIN channel 連結至 Messaging API channel）
  try {
    const friendship = await liff.getFriendship();
    if (!friendship?.friendFlag) {
      // 使用者尚未加好友（可能在彈出畫面按了「略過」）
      // 顯示說明 + 重試按鈕，讓使用者可以再觸發一次加好友畫面
      setStatus(
        "➕",
        "需要先加入好友",
        "請先點「前往加好友」，完成後再點「我已加入，重新驗證」。",
        false
      );
      document.getElementById("friend-actions").style.display = "";
      return;
    }
  } catch {
    // getFriendship 在部分瀏覽器環境不支援（如 External Browser 模式），忽略並繼續
  }

  // 向後端證明身分：送 LIFF 的 ID Token，由 line-login（後端金鑰）向 LINE 驗證後才發 token。
  // 這一頁本身拿不到長期 token，只拿一次性登入碼；QR 綁定的 PC 端由後端寫入結果。
  // 以前這裡直接 PATCH pending_line_auth 再呼叫 get_or_create_user——那兩個入口對 anon 全開，
  // 等於任何人只要知道 LINE userId 就能拿到別人的帳號（SECURITY.md）。
  // 舊使用者是在沒有 openid scope 的時候授權的，快取的登入沒有 ID Token：
  // 自動登出重登一次（sessionStorage 防無限迴圈），還是拿不到才是 LIFF 設定沒開 openid。
  const idToken = liff.getIDToken();
  if (!idToken) {
    if (!sessionStorage.getItem("liff_relogin_tried")) {
      sessionStorage.setItem("liff_relogin_tried", "1");
      liff.logout();
      liff.login({ redirectUri: location.href, botPrompt: "aggressive" });
      return;
    }
    setStatus("❌", "無法取得 LINE 身分憑證",
      "LIFF 應用需開啟 openid 權限（LINE Developers → LINE Login channel → LIFF → Scopes）。", true);
    return;
  }
  sessionStorage.removeItem("liff_relogin_tried");

  let result;
  try {
    const r = await fetch(`${SUPABASE_URL}/functions/v1/line-login`, {
      method: "POST",
      headers: {
        "apikey":        SUPABASE_ANON,
        "Authorization": `Bearer ${SUPABASE_ANON}`,
        "Content-Type":  "application/json",
        "X-App-Version": (document.querySelector('meta[name="app-version"]') || {}).content || "0",
      },
      body: JSON.stringify({
        action:        "verify",
        id_token:      idToken,
        session_token: isBindMode ? sessionToken : null,
        display_name:  profile.displayName,
      }),
    });
    result = await r.json().catch(() => ({}));
    if (result.code === "update_required") {
      // 這一頁太舊：重載一次拿新版；還是舊版就是 Pages 還在建置，請使用者稍後再掃
      if (!sessionStorage.getItem("liff_update_reloaded")) {
        sessionStorage.setItem("liff_update_reloaded", "1");
        location.reload();
        return;
      }
      setStatus("🔄", "App 更新中", "新版本部署中，請一兩分鐘後再掃一次 QR Code。", true);
      return;
    }
    if (!r.ok) {
      // ID Token 是登入當下簽發的，LIFF 快取久了會過期：登出重登一次就有新的
      if (r.status === 401 && /逾時/.test(String(result.error || ""))) {
        liff.logout();
        liff.login({ redirectUri: location.href, botPrompt: "aggressive" });
        return;
      }
      throw new Error(result.error || `HTTP ${r.status}`);
    }
  } catch (e) {
    setStatus("❌", isBindMode ? "綁定失敗" : "登入失敗", `請重試或聯絡管理員（${e.message}）`, true);
    return;
  }

  if (isBindMode && !result.bound) {
    setStatus("⏰", "QR Code 已過期", "請回到電腦點「重新產生 QR Code」再掃一次。", true);
    return;
  }

  setStatus("✅", isBindMode ? "綁定成功！" : "登入成功！", `${profile.displayName}，即將開啟監控頁面…`);

  // 2 秒後開啟 watchlist.html：帶一次性登入碼（2 分鐘內有效、用過即失效）。
  // 網址裡不再出現長期 access_token。
  // 在 LINE 裡：external:true 交給系統瀏覽器（內建瀏覽器訂不到推播）；
  // 不在 LINE 裡（相機掃碼直接開 Chrome）：以前這裡什麼都不做，畫面就停在「即將開啟」。
  setTimeout(() => {
    if (!result.login_code) return;
    const dest = `https://betewo-web.github.io/CapitalGuard-pages/watchlist.html?code=${encodeURIComponent(result.login_code)}`;
    try {
      if (liff.isInClient()) { liff.openWindow({ url: dest, external: true }); return; }
    } catch {}
    location.href = dest;
  }, 2000);
}

// ── 分享模式（FRIENDS.md「LINE 卡片分享」、2026-10-12）────────────────────────
// App 那邊（watchlist.html 的 sendSignalShareCard）已經把圖存成有網址的圖、拿到 token。
// 這裡在 LINE 內建瀏覽器裡：讀那一則 → 組 Flex 卡片 → liff.shareTargetPicker 開「選好友」。
// 為什麼要跑到 LINE 裡才做：外部瀏覽器呼叫 shareTargetPicker 需要 SSO 登入 session，LINE App
// 自動登入拿不到，官方文件寫明「可能顯示電子郵件登入畫面」。在 LINE 裡則什麼登入畫面都沒有。
// Flex 的限制：bubble（不能 carousel）、動作只能 uri。卡片長什麼樣見 shareFlex。
const APP_URL    = "https://betewo-web.github.io/CapitalGuard-pages/watchlist.html";
const SHARE_PAGE = "https://betewo-web.github.io/CapitalGuard-pages/share.html";
const SHARE_DISCLAIMER = "公開市場資料整理，不是投資建議";
let _shareData = null;
let _shareToken = "";

function shareShow(id, on) {
  const el = document.getElementById(id);
  if (el) el.style.display = on ? "" : "none";
}

async function shareMain(token) {
  _shareToken = token;
  document.getElementById("title").textContent = "正在準備卡片…";
  let res;
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/share_link_get`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON, "Authorization": `Bearer ${SUPABASE_ANON}`,
        "Content-Type": "application/json",
        "X-App-Version": (document.querySelector('meta[name="app-version"]') || {}).content || "0",
      },
      body: JSON.stringify({ p_token: token }),
    });
    res = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
  } catch (e) {
    setStatus("❌", "讀不到這則分享", e.message, true);
    return;
  }
  if (!res || res.error) {
    setStatus("❌", res && res.error === "expired" ? "這則分享已過期" : "找不到這則分享",
      "回到 App 再按一次「做成 LINE 卡片」。", true);
    shareShow("share-actions", false);
    return;
  }
  _shareData = res;
  if (!liff.isApiAvailable("shareTargetPicker")) {
    // Console 沒開 Share target picker、或 LINE 版本太舊：退回 LINE 的分享網址（只收文字）
    setStatus("ℹ️", "這個 LINE 不能直接選好友",
      "LINE Developers Console 還沒開 Share target picker、或 LINE 版本太舊。改用下面那顆把網址傳出去。", true);
    shareShow("share-fallback", true);
    return;
  }
  setStatus("📨", `${res.stock_name || ""} ${res.stock_id}`.trim(), `${res.body || res.title || ""}\n按「選好友傳送」把卡片傳出去。`);
  shareShow("share-actions", true);
  await sharePick();    // 直接開面板，少按一次
}

// 卡片＝圖＋六格貼圖＋安裝（Howard 2026-10-13：文字說明全部拿掉——圖上已經有哪一檔、幾點、什麼訊號，
// 底部也有免責那一行 SIGNAL_SHARE_FOOT，不必再寫一次）。
// 貼圖直接做成卡片上的按鈕：LINE 規定使用者傳出去的卡片只能有「開網址」動作（postback 只有官方帳號的
// 機器人能用，而且只能發給加過好友的人），所以每一格開 share.html 並帶 rx=<代碼>，頁面一載入就把回饋
// 記下來——對方少按一次，但頁面本身不可能不開。貼圖的字從 share_link_get 回的 kinds 來（SQL 是單一來源）。
// 卡片的底色＝App 的 --bg-1／--surface-2；圖示 PNG 在 PWA 的 Pages 上，改圖就把 SHARE_ICON_VER 加一（LINE 會快取）
const SHARE_CARD_BG = "#0f0f1a";
const SHARE_CARD_TILE_BG = "#1c1c2b";
const SHARE_ICON_BASE = "https://betewo-web.github.io/CapitalGuard-pages/icons/rx";
const SHARE_ICON_VER = "1";
const SHARE_KINDS_FALLBACK = [
  { code: "awesome", label: "厲害" }, { code: "sharp_eye", label: "有眼光" }, { code: "bittersweet", label: "淡淡哀傷" },
  { code: "thanks", label: "感謝提醒" }, { code: "it_happened", label: "竟然這樣" }, { code: "watch_together", label: "一起觀察" },
];
function shareFlex(d) {
  const page = `${SHARE_PAGE}?t=${encodeURIComponent(_shareToken)}`;
  // hero 的 aspectRatio 是「寬:高」兩個整數，高不能超過寬的三倍（這張圖是橫的，沒這個問題）
  const w = Math.max(1, Number(d.image_w) || 1200), h = Math.max(1, Number(d.image_h) || 630);
  const gcd = (a, b) => (b ? gcd(b, a % b) : a);
  const k = gcd(w, h) || 1;
  const kinds = Array.isArray(d.kinds) && d.kinds.length ? d.kinds : SHARE_KINDS_FALLBACK;
  // 一格＝圖＋小字（Howard 2026-10-13：按鈕的字太大顯示不完整，而且要有 App 那一套圖示）。
  // Flex 的 button 字級固定不能縮，所以格子用 box（box 也能掛動作）：image 吃 PNG 網址（web/icons/rx/<code>.png，
  // 從 App 的 RX_ART 截的、透明底）、text 用 xs。底色跟圖一樣是深色，整張卡片看起來是一塊。
  const rxTile = (x) => ({
    type: "box", layout: "vertical", flex: 1, spacing: "xs", paddingAll: "6px", cornerRadius: "8px",
    backgroundColor: SHARE_CARD_TILE_BG, alignItems: "center",
    action: { type: "uri", label: String(x.label || x.code).slice(0, 20), uri: `${page}&rx=${encodeURIComponent(x.code)}&src=rx` },
    contents: [
      { type: "image", url: `${SHARE_ICON_BASE}/${encodeURIComponent(x.code)}.png?v=${SHARE_ICON_VER}`, size: "28px", aspectRatio: "1:1", aspectMode: "fit" },
      { type: "text", text: String(x.label || x.code).slice(0, 8), size: "xs", color: "#f5f5f7", align: "center", wrap: false },
    ],
  });
  const rows = [];
  for (let i = 0; i < kinds.length; i += 3) {
    rows.push({ type: "box", layout: "horizontal", spacing: "sm", contents: kinds.slice(i, i + 3).map(rxTile) });
  }
  return {
    type: "bubble", size: "mega",
    hero: {
      type: "image", url: d.image_url, size: "full", aspectMode: "fit",
      aspectRatio: `${Math.round(w / k)}:${Math.round(h / k)}`, backgroundColor: SHARE_CARD_BG,
      action: { type: "uri", label: "看這則訊號", uri: `${page}&src=card` },
    },
    footer: {
      type: "box", layout: "vertical", spacing: "sm", paddingAll: "10px", backgroundColor: SHARE_CARD_BG, contents: [
        ...rows,
        { type: "button", style: "link", height: "sm", color: "#8b7cff",
          action: { type: "uri", label: "我也要收到這種提醒（免費）", uri: `https://line.me/R/ti/p/${OA_BASIC_ID}` } },
      ],
    },
  };
}

async function sharePick() {
  if (!_shareData) return;
  const d = _shareData;
  const alt = `${d.owner_name || "朋友"} 分享：${d.stock_name || ""} ${d.stock_id} ${d.title || ""}（CapitalGuard-股市雷達）`.slice(0, 400);
  try {
    const r = await liff.shareTargetPicker(
      [{ type: "flex", altText: alt, contents: shareFlex(d) }],
      { isMultiple: true },
    );
    if (r && r.status === "success") {
      setStatus("✅", "卡片傳出去了", "對方點卡片上的按鈕就能看訊號、回貼圖。你會在 App 的「我收到的回饋」看到。");
    } else {
      setStatus("↩️", "沒有傳送", "面板關掉了。要再試一次就按「選好友傳送」。");
    }
  } catch (e) {
    setStatus("❌", "傳送失敗", (e && e.message) || String(e), true);
  }
  shareShow("share-actions", true);
}

function shareBack() {
  try { if (liff.isInClient()) { liff.closeWindow(); return; } } catch {}
  location.href = APP_URL;
}

// 退路：LINE 的分享網址只收文字，把落地頁的網址送進聊天室選單
function shareSendUrl() {
  const d = _shareData || {};
  const page = `${SHARE_PAGE}?t=${encodeURIComponent(_shareToken)}&src=link`;
  const text = `${d.stock_name || ""} ${d.stock_id || ""} ${d.body || d.title || ""}\n${SHARE_DISCLAIMER}\n${page}`;
  location.href = `https://line.me/R/share?text=${encodeURIComponent(text)}`;
}

function openAddFriendPage() {
  const addFriendUrl = `https://line.me/R/ti/p/${OA_BASIC_ID}`;
  try {
    if (typeof liff !== "undefined" && liff.isInClient()) {
      liff.openWindow({ url: addFriendUrl, external: true });
    } else {
      window.open(addFriendUrl, "_blank");
    }
  } catch {
    window.open(addFriendUrl, "_blank");
  }
}

function recheckFriendship() {
  hideFriendActions();
  document.getElementById("spinner").style.display = "";
  document.getElementById("icon").style.display = "none";
  document.getElementById("title").textContent = "正在重新驗證 LINE 好友狀態…";
  const msgEl = document.getElementById("msg");
  msgEl.textContent = "";
  msgEl.classList.remove("err");
  location.reload();
}

main();
</script>
</body>
</html>
